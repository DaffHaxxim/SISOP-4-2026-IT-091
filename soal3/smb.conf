#======================= Global Settings =======================
[global]
   workgroup = WORKGROUP
   server string = LibraryIT Server
   server role = standalone server
   security = user
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB2
   access based share enum = yes

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   log file = /libraryit/logs/samba.log
   max log size = 1000
   log level = 1

   vfs objects = full_audit
   full_audit:prefix = %U|%S
   full_audit:success = connect disconnect mkdir rmdir read write pwrite pread open opendir unlink rename
   full_audit:failure = connect mkdir read write open opendir
   full_audit:facility = LOCAL5
   full_audit:priority = NOTICE

#======================= Share Definitions =======================

[ebooks]
   comment = E-Books Collection
   path = /libraryit/ebooks
   valid users = @readonly, @staff
   read only = yes
   write list = @staff
   browseable = yes
   guest ok = no
   create mask = 0664
   directory mask = 0775

[papers]
   comment = Research Papers
   path = /libraryit/papers
   valid users = @readonly, @staff
   read only = yes
   write list = @staff
   browseable = yes
   guest ok = no
   create mask = 0664
   directory mask = 0775

[sourcecode]
   comment = Source Code Repository
   path = /libraryit/sourcecode
   valid users = @staff
   read only = yes
   write list = @staff
   browseable = yes
   guest ok = no
   create mask = 0640
   directory mask = 0750
   force user = root
   force group = staff

[docs]
   comment = Technical Documentation
   path = /libraryit/docs
   valid users = @readonly, @staff
   read only = yes
   write list = librarian
   browseable = yes
   guest ok = no
   create mask = 0664
   directory mask = 0775
